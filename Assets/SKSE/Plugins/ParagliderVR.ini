[Calibration]
; Diagnostic mode only. Normal play requires the player to be airborne.
bEnabled=false

[Activation]
; Both hands must be at least this many Skyrim units above the HMD while both grips are held.
fHandsAboveHead=8.0
; While flying, a hand with its grip still held may descend this far below the HMD before the glider closes.
fHandsBelowHeadLimit=10.0

[Flight]
; With both grips held, the dominant-hand thumbstick ranges from gentle fall to controlled descent.
fDualMinimumFallMultiplier=0.10
fDualMaximumFallMultiplier=0.40
; Releasing either hand switches to this fixed fall-speed multiplier.
fSingleFallMultiplier=0.65
; Reference terminal fall speed. The multipliers above produce caps of 50-200 and 325 units/s.
fReferenceFallSpeed=500.0
; Pushing the dominant-hand thumbstick forward produces only a gentle climb.
fMaximumClimbSpeed=25.0
; Horizontal speed range controlled only by the offhand thumbstick while the glider is open.
fMinimumForwardSpeed=80.0
fSteeringSpeed=560.0
; Offhand thumbstick forward accelerates and backward brakes. Neutral preserves the requested speed.
fHorizontalAcceleration=160.0
fHorizontalDeceleration=220.0
fThumbstickDeadzone=0.20
; Offhand left/right adds lateral velocity relative to the HMD direction.
fLateralSpeedScale=0.60
; Maximum vertical correction per second when opening the glider or requesting lift.
fVerticalTransitionAcceleration=1400.0

[GestureControl]
; Adds calibrated hand-pose controls while preserving the thumbstick controls.
bEnabled=true
; Maximum position and rotation error used to recognize the nearest calibrated pose.
fPositionTolerance=20.0
fRotationToleranceDegrees=40.0
; Rejects weak accidental pose matches. Higher values require a closer match.
fMinimumConfidence=0.10
; Controls how quickly gesture input blends between poses. Higher values react faster.
fTransitionSpeed=5.0

[Stamina]
fStaminaPerSecond=8.0
; Exhaustion never closes the glider. Horizontal speed transitions to half and fall speed to 65% of reference.
fExhaustedHorizontalSpeedScale=0.50
fExhaustedFallMultiplier=0.65

[FireLift]
; Entering the vertical column above a recognized campfire, brazier, forge, or flame applies one upward impulse.
bEnabled=true
fHorizontalRadius=120.0
fMaximumHeight=450.0
fVerticalImpulse=2500.0
; Uses an ease-out curve: strong acceleration at the beginning, fading smoothly to zero.
fImpulseDuration=0.20
; Nearby references are scanned at this interval while the paraglider is open.
fScanInterval=0.10

[Visual]
sModelPath=Paraglider\Glider.nif
; The source rig's lateral grip points are about 15 Skyrim units above its root.
fVisualHeight=-15.0
fVisualForward=0.0
; The source model is exported from meters to Skyrim units.
fVisualScale=1.0
fVisualRotationX=0.0
fVisualRotationY=0.0
fVisualRotationZ=0.0

[WindVisual]
; Uses a vanilla Skyrim particle directly from Skyrim - Meshes0.bsa. No external asset is required.
bEnabled=true
sModelPath=effects\fxcameraattachblowingfog.nif
; Anchored to the third-person player root, not directly to the HMD.
fHeight=90.0
fForward=0.0
fScale=0.75
fRotationX=0.0
fRotationY=0.0
fRotationZ=0.0
